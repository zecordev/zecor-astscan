# SPDX-License-Identifier: Apache-2.0
[package]
name = "zecor-astscan"
description = "Multi-language syntax checking and top-level symbol extraction via Tree-sitter."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Hilachem Ventures LLC"]
repository = "https://github.com/zecordev/zecor-astscan"
rust-version = "1.75"

[lib]
name = "zecor_astscan"
path = "src/lib.rs"

[[bin]]
name = "zecor-astscan"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
